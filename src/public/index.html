<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testador de API - Academia</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border: none; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 5px; }
    .tab-btn.active { background: #3498db; color: white; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-get { background-color: #3498db; color: white; }
    .btn-post { background-color: #2ecc71; color: white; }
    .btn-put { background-color: #f39c12; color: white; }
    .btn-delete { background-color: #e74c3c; color: white; }
    button:hover { opacity: 0.9; }
    pre { background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px; }
    .status-bar { margin-top: 10px; font-weight: bold; padding: 8px; border-radius: 4px; display: none; }
    .status-success { background: #d4edda; color: #155724; display: block; }
    .status-error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <h1>🏋️ Testador de API - Sistema de Academia</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="setEntity('alunos')">Alunos</button>
    <button class="tab-btn" onclick="setEntity('exercicios')">Exercícios</button>
    <button class="tab-btn" onclick="setEntity('maquinas')">Máquinas</button>
    <button class="tab-btn" onclick="setEntity('treinos')">Treinos</button>
  </div>

  <div class="container">
    <h2 id="entity-title">Gestão de Alunos (/alunos)</h2>

    <div class="form-group">
      <label for="req-id">ID do Recurso (para Buscar, Atualizar ou Deletar):</label>
      <input type="text" id="req-id" placeholder="Ex: 1">
    </div>

    <div class="form-group">
      <label for="req-body">Corpo da Requisição JSON (para Criar ou Atualizar):</label>
      <textarea id="req-body" rows="6" placeholder='{\n  "nome": "Pedro Ferreira",\n  "idade": 23\n}'></textarea>
    </div>

    <div class="actions">
      <button class="btn-get" onclick="enviarRequisicao('GET')">GET (Listar Todos)</button>
      <button class="btn-get" onclick="enviarRequisicao('GET_BY_ID')">GET /:id (Buscar por ID)</button>
      <button class="btn-post" onclick="enviarRequisicao('POST')">POST (Criar)</button>
      <button class="btn-put" onclick="enviarRequisicao('PUT')">PUT /:id (Atualizar)</button>
      <button class="btn-delete" onclick="enviarRequisicao('DELETE')">DELETE /:id (Excluir)</button>
    </div>

    <div id="status" class="status-bar"></div>

    <h3>Resposta do Servidor:</h3>
    <pre id="response-output">// Os resultados das requisições aparecerão aqui...</pre>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000'; // Ajuste a porta se necessário
    let currentEntity = 'alunos';

    const placeholders = {
      alunos: '{\n  "nome": "Pedro Ferreira",\n  "cpf": "12345678900",\n  "idade": 23\n}',
      exercicios: '{\n  "nome": "Supino Reto",\n  "agrupamento": "PEITO"\n}',
      maquinas: '{\n  "nome": "Cadeira Extensora",\n  "status": "DISPONIVEL"\n}',
      treinos: '{\n  "alunoId": 1,\n  "diaSemana": "SEGUNDA",\n  "exercicioId": 1\n}'
    };

    function setEntity(entity) {
      currentEntity = entity;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('entity-title').innerText = `Gestão de ${entity.toUpperCase()} (/${entity})`;
      document.getElementById('req-body').value = placeholders[entity] || '{}';
      document.getElementById('req-id').value = '';
    }

    // Inicializa o placeholder
    document.getElementById('req-body').value = placeholders['alunos'];

    async function enviarRequisicao(metodo) {
      const id = document.getElementById('req-id').value.trim();
      const bodyText = document.getElementById('req-body').value.trim();
      const statusDiv = document.getElementById('status');
      const output = document.getElementById('response-output');

      let url = `${API_BASE_URL}/${currentEntity}`;
      let options = {
        headers: { 'Content-Type': 'application/json' }
      };

      try {
        if (metodo === 'GET_BY_ID') {
          if (!id) return alert('Por favor, informe o ID no campo correspondente.');
          url += `/${id}`;
          options.method = 'GET';
        } else if (metodo === 'GET') {
          options.method = 'GET';
        } else if (metodo === 'POST') {
          options.method = 'POST';
          options.body = bodyText;
        } else if (metodo === 'PUT') {
          if (!id) return alert('Por favor, informe o ID para atualizar.');
          url += `/${id}`;
          options.method = 'PUT';
          options.body = bodyText;
        } else if (metodo === 'DELETE') {
          if (!id) return alert('Por favor, informe o ID para deletar.');
          url += `/${id}`;
          options.method = 'DELETE';
        }

        output.innerText = "Enviando requisição...";
        statusDiv.style.display = 'none';

        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({ mensagem: "Resposta sem corpo JSON" }));

        statusDiv.className = `status-bar ${response.ok ? 'status-success' : 'status-error'}`;
        statusDiv.innerText = `Status HTTP: ${response.status} (${response.statusText || 'OK'})`;

        output.innerText = JSON.stringify(data, null, 2);

      } catch (err) {
        statusDiv.className = 'status-bar status-error';
        statusDiv.innerText = 'Erro ao conectar com a API';
        output.innerText = JSON.stringify({
          erro: "Não foi possível conectar ao servidor. Certifique-se de que o backend está rodando e que o CORS está habilitado se necessário.",
          detalhes: err.message
        }, null, 2);
      }
    }
  </script>
</body>
</html>
