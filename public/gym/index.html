<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymControl — Sistema de Gestão de Academia</title>
<meta name="description" content="GymControl é um sistema moderno de gestão de academia para equipamentos, fichas de treino e alunos." />
<link rel="icon" href="/favicon.ico" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/gym/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="sidebar__brand">
        <span class="brand-mark"><i class="fa-solid fa-dumbbell"></i></span>
        <span class="brand-text">Gym<strong>Control</strong></span>
        <button class="btn-icon sidebar__close d-lg-none" id="sidebarClose" aria-label="Fechar menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Items are rendered by app.js according to the signed-in user's role -->
      <nav class="sidebar__nav" id="sidebarNav"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="btn-icon d-lg-none" id="sidebarToggle" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar__titles">
          <h1 class="topbar__title" id="pageTitle">Painel</h1>
          <p class="topbar__subtitle" id="pageSubtitle">Visão geral da operação da academia</p>
        </div>
        <div class="topbar__actions">
          <label class="search search--top" id="topSearchWrap" hidden>
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="topSearch" placeholder="Pesquisar…" aria-label="Pesquisar" />
          </label>
          <button class="btn-icon btn-icon--bell" type="button" id="notificationsBtn" aria-label="Notificações">
            <i class="fa-regular fa-bell"></i><span class="dot" aria-hidden="true"></span>
          </button>
          <div style="position:relative">
            <button class="user-chip" id="userChip" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu">
              <span class="avatar avatar--sm" id="userAvatar"></span>
              <span class="user-chip__meta">
                <span class="user-chip__name" id="userName"></span>
                <span class="user-chip__role" id="userRole"></span>
              </span>
              <i class="fa-solid fa-chevron-down user-chip__caret"></i>
            </button>
            <div class="user-menu" id="userMenu" role="menu" hidden>
              <div class="user-menu__head"><strong id="menuName"></strong><span id="menuEmail"></span></div>
              <button class="user-menu__item user-menu__item--danger" id="logoutBtn" type="button" role="menuitem"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- WhatsApp floating button -->
  <a class="whatsapp-fab" href="https://wa.me/5500000000000" target="_blank" rel="noopener" aria-label="Fale conosco no WhatsApp">
    <i class="fa-brands fa-whatsapp"></i><span class="whatsapp-fab__text">Fale conosco</span>
  </a>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <!-- Generic modal -->
  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-root__backdrop" data-modal-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-panel__head">
        <h2 id="modalTitle" class="modal-panel__title">Título</h2>
        <button class="btn-icon" type="button" data-modal-close aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="modal-panel__body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="/gym/js/app.js"></script>
</body>
</html>
